Shipshape/CallGraph:
  Description: >-
    Every class has a kind, and which kinds may call which is declared once, as a matrix.
    A rule cannot escape its home if there is nowhere reachable to escape to.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which paths hold which kind. Order matters: the first match wins, so put the
  # narrower tree above the wider one.
  Kinds:
    request_handling:
      - 'app/controllers/**/*.rb'
    workflow:
      - 'app/workflows/**/*.rb'
    command:
      - 'app/commands/**/*.rb'
    query:
      - 'app/queries/**/*.rb'
    gateway:
      - 'app/gateways/**/*.rb'
      - 'app/integrations/**/*.rb'
    entity:
      - 'app/entities/**/*.rb'
      - 'app/values/**/*.rb'
    record:
      - 'app/records/**/*.rb'
      - 'app/models/**/*.rb'
  # Who may call whom. A pair absent from this matrix is an offence.
  #
  # NO KIND CALLS ITS OWN KIND. That rule lives in the cop, not here: a row that names
  # itself is refused as a contradiction rather than honoured as a permission. This matrix
  # says which OTHER kinds are reachable.
  #
  # A sister call is how a class quietly becomes the kind above it — a command sequencing
  # commands is a workflow that never said so, and a query composing queries is the read
  # that turns into an N+1. Sequence them from the kind above instead.
  #
  # A gateway is a command that crosses the process boundary — it is the only kind that
  # may talk to anything outside. It reaches no record and no query, so the external call
  # and the write that records its result are two visible steps rather than one. Request
  # handling cannot reach one directly: an external call has a domain meaning, and the
  # command or workflow that wanted it is where that meaning lives.
  Matrix:
    request_handling:
      - workflow
      - command
      - query
    workflow:
      - command
      - query
      - gateway
    command:
      - query
      - gateway
      - entity
      - record
    query:
      - entity
      - record
    gateway:
      - entity
    entity: []
    record: []
