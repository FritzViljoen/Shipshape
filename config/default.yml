Shipshape/CallGraph:
  Description: >-
    Every class has a kind, and which kinds may call which is declared once, as a matrix.
    A rule cannot escape its home if there is nowhere reachable to escape to.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which paths hold which kind. Order matters: the first match wins, so put the
  # narrower tree above the wider one.
  #
  # A glob's trailing wildcards are dropped and what remains is expanded on disk to get
  # the autoload roots a constant name is resolved against — so a Packwerk layout needs no
  # second mechanism, and each pack becomes its own root.
  #
  # Two kinds carry a filename suffix, and for one reason: they are the two that are
  # infrastructure rather than domain. Everything the MVC model used to hold has been split
  # into workflows, deeds, questions and shapes, so what is still called a record is
  # only the table — and it is named to say so.
  #
  Kinds:
    request_handling:
      - 'app/controllers/**/*_controller.rb'
      - 'packs/*/controllers/**/*_controller.rb'
      # A concern included into a controller IS request handling, and the suffix above cannot
      # see one. Over lobsters `story_finder.rb` reached two records, read a raw parameter into
      # `find_by`, branched on `is_admin?` and wrote through the row it found — four laws in
      # 26 lines, reported clean. The record kind already declares its concerns this way.
      - 'app/controllers/concerns/**/*.rb'
      - 'packs/*/controllers/concerns/**/*.rb'
    # The other doors. A job, a subscriber and a channel are request handling through a
    # different entrance: each parses its input, calls operations and decides nothing.
    #
    # MAILERS ARE NOT HERE. Sending mail leaves the process, so a send is an io_deed;
    # the body it renders is a template like any other. In the shape being asked for there
    # is no mailer directory at all — during migration there is, and it is classified below
    # as what it does rather than where it sits.
    #
    # SUBSCRIBERS AND CHANNELS ARE, and it is a close call. Both are reached from outside
    # their own call path, which is what makes them feel like IO. But io_deed's row is
    # `question, shape` — a subscriber classified there would be a violation for doing the one
    # thing subscribers do, which is call a domain operation.
    #
    # What is actually wrong with them is not their kind. A subscriber is invoked by an
    # event whose listeners are discovered at runtime, and that is a distant write —
    # `nothing-travels-off-the-call-path` names it. A law it breaks, not a kind it is.
    #
    # In the target shape neither directory exists: a subscriber becomes an explicit step in
    # a workflow, and a channel's broadcast becomes an io_deed while its subscribe stays
    # a door. Until then the row here is the one that fits what they do.
    entry_point:
      - 'app/jobs/**/*.rb'
      - 'app/subscribers/**/*.rb'
      - 'app/channels/**/*.rb'
      - 'packs/*/jobs/**/*.rb'
    # What renders. A view component holds shapes and asserts them with the same `typed`
    # guard as everything else — it is the one place presentation is allowed to live, and
    # there is no presenter, decorator or helper kind because those dissolve: their methods
    # only rearrange fields they were handed, which is what a shape may carry.
    view_component:
      - 'app/view_components/**/*.rb'
      - 'packs/*/view_components/**/*.rb'
    workflow:
      - 'app/workflows/**/*.rb'
      - 'packs/*/workflows/**/*.rb'
    deed:
      - 'app/deeds/**/*.rb'
      - 'packs/*/deeds/**/*.rb'
    question:
      - 'app/questions/**/*.rb'
      - 'packs/*/questions/**/*.rb'
    # Reading and changing state OUTSIDE this process. Same two operations, marked, and the
    # `Io` prefix on the class name means the crossing is visible at every call site.
    #
    # THE REASON THEY ARE SEPARATE KINDS IS THE TRANSACTION. A deed is exactly one
    # transaction; an external call inside one holds a database transaction open across a
    # network round trip, and a remote write cannot be rolled back by it in any case. So a
    # deed may not do IO — the external call and the local write that records it are two
    # steps, sequenced by a workflow, which is the only kind that has accepted the bill for
    # spanning them.
    #
    # They are SISTERS of the internal pair, not new concepts: an io_deed is a deed
    # whose store belongs to somebody else. Which is why a deed may not call one.
    io_question:
      - 'app/io/**/*.rb'
      - 'packs/*/io/**/*.rb'
    io_deed:
      - 'app/io/**/*.rb'
      - 'app/mailers/**/*.rb'
      - 'packs/*/io/**/*.rb'
      - 'packs/*/mailers/**/*.rb'
    # The two doors to the old world, and the only classes permitted to speak to it. A
    # governed class may not reach legacy code directly; it goes through one of these, and
    # the suffix means the dependency is visible at the call site without opening anything.
    #
    # There are two rather than one so that the return shape survives the crossing: a
    # legacy question answers with shapes, a legacy deed answers with a Result. A single
    # door would have to answer both ways, and that is the flag this canon refuses.
    #
    # Both share one suffix. The path says "this is a door"; the BASE CLASS says which of
    # the two it is, because inheritance is the thing that carries the return shape and a
    # second copy of that fact in the filename would be the copy that goes stale.
    #
    # Why marked rather than just wrapped: the new shape admits only its own kinds, so an
    # unwrapped legacy service cannot be called from a workflow at all. Wrapping is how old
    # code gets in, and the mark keeps the crossing visible at the call site.
    #
    # Their population is the migration backlog. It RISES while the old world is pulled
    # into the new shape and falls only as each wrapped thing is rewritten — a curve, not a
    # ratchet. The ratchet governs violations, and a door is not a violation.
    # A third-party read DSL — a datagrid, a report builder — is a read wearing someone
    # else's shape, which is what this kind is for. It is NOT listed here: the paths a
    # legacy door lives at are the application's to declare, and a glob shipped in the
    # default config would claim a directory most repositories do not have. Add
    # `app/grids/**/*.rb` to this list in your own .rubocop.yml where the gem is in use.
    legacy_question:
      - 'app/legacy/**/*_legacy.rb'
      - 'packs/*/legacy/**/*_legacy.rb'
    legacy_deed:
      - 'app/legacy/**/*_legacy.rb'
      - 'packs/*/legacy/**/*_legacy.rb'
      # A concern has no superclass, so the path decides — and the two legacy kinds share one
      # glob. It goes to the deed, whose matrix row is the wider of the two: over-firing on
      # correct code is how a cop gets switched off, and under-firing here costs one row.
      - 'app/legacy/concerns/**/*.rb'
      - 'packs/*/legacy/concerns/**/*.rb'
    shape:
      - 'app/shapes/**/*.rb'
      - 'packs/*/shapes/**/*.rb'
    record:
      - 'app/records/**/*_record.rb'
      - 'app/models/**/*.rb'
      - 'packs/*/records/**/*_record.rb'
      - 'packs/*/models/**/*.rb'
      # A concern mixed into a record is the record, and the callback law says so by name.
      # The `*_record.rb` suffix above would otherwise cover concerns in the legacy tree and
      # not in the one this canon migrates toward.
      - 'app/records/concerns/**/*.rb'
      - 'packs/*/records/concerns/**/*.rb'
  # What each kind's classes inherit from. THE SUPERCLASS DECIDES THE KIND; the paths above
  # only decide which trees are governed at all. Two kinds may therefore share a glob — the
  # legacy pair do — and a governed file whose superclass is not listed here falls back to
  # its path, or to no kind if the path does not say either.
  # **Rails' own base classes are named here too.** They live inside the trees these globs
  # cover — `app/mailers/application_mailer.rb` is under the io_deed glob — so a class
  # inheriting one looked like a second level of inheritance to
  # Shipshape/OperationsAreLeaves, which fired on every mailer in forem. Being on this list
  # is what makes a name a base class, and a rename buys nothing, so it cannot go stale.
  # A waypoint, not a destination: code leaves a legacy door and nothing new arrives. Declared
  # here, beside the kinds, because an agent reading what the kinds are must read this in the
  # same breath — a refactor into a kind on its way out is how a migration stops half way.
  Retiring:
    - legacy_deed
    - legacy_question
  BaseClasses:
    workflow: [Workflow]
    deed: [Deed]
    question: [Question]
    io_question: [IoQuestion]
    io_deed: [IoDeed, ApplicationMailer, ActionMailer::Base]
    legacy_question: [LegacyQuestion]
    legacy_deed: [LegacyDeed]
    view_component: [ApplicationViewComponent, ViewComponent::Base]
    shape: [Shape]
    record: [ApplicationRecord, ActiveRecord::Base]
    # No subscriber base is listed: `shipshape install` writes none, because Rails ships no
    # convention for one the way it does `ApplicationJob`. A subscriber correctly inheriting
    # its own base still fires `KindIsInheritedNotOnlyPlaced` until that base is added here —
    # over-firing on correct code is how a cop gets switched off. See `an-adoption-order.md`,
    # step 1.
    entry_point: [ApplicationJob, ActiveJob::Base, ApplicationCable::Channel, ActionCable::Channel::Base]
    request_handling: [ApplicationController, ActionController::Base, ActionController::API]
  # Kinds that are the same thing wearing different clothes. NO KIND CALLS A SISTER, and
  # every kind is its own sister — that rule lives in the cop, not here, so a Matrix row
  # naming a sister stops the run rather than being honoured.
  #
  # A legacy deed is a deed that wraps something old, so calling one from a deed is a deed
  # calling another deed — and two deeds always done together are one deed. Nesting them
  # either nests a transaction or silently widens one, and either way nobody decided it —
  # whereas a workflow crossing transactions is obliged to make each step idempotent and
  # each intermediate state legal.
  Sisters:
    - [deed, io_deed, legacy_deed]
    - [question, io_question, legacy_question]
  # Who may call whom. A pair absent from this matrix is an offence.
  Matrix:
    request_handling:
      - workflow
      - deed
      - question
      - io_deed
      - io_question
      - legacy_deed
      - legacy_question
      - view_component
      - shape
    # The same row as request handling, exactly. A job is a controller with a different
    # doorbell: it parses its input, calls operations, decides nothing, and a mailer renders
    # at the end of it just as an action does.
    entry_point:
      - workflow
      - deed
      - question
      - io_deed
      - io_question
      - legacy_deed
      - legacy_question
      - view_component
      - shape
    # It renders what it was handed and reads nothing. A component that can reach an
    # operation is a controller with a template.
    view_component:
      - shape
    workflow:
      - deed
      - question
      - io_deed
      - io_question
      - legacy_deed
      - legacy_question
      - shape
    # NO IO IN A DEED OR A QUESTION. A deed is one transaction, and an external call
    # inside one holds it open across a network round trip; a question reads what it names, and
    # an external call is a read nobody can see. Both are sisters besides.
    deed:
      - question
      - legacy_question
      - shape
      - record
    question:
      - shape
      - record
    # An io operation talks to the outside, which is unclassified and therefore skipped, so
    # its row only names what it may reach among the kinds. It touches no record: the
    # external call and the local write that records it are two steps, and a workflow
    # sequences them.
    #
    # `io_deed -> io_question` mirrors `deed -> question`: a write may read first, and
    # fetching a token before posting is that shape. The read it may do is the one in its
    # own world.
    #
    # It may NOT reach `question`, which it could before this was looked at. An external write
    # pulling from the local store is reaching back across the boundary it just crossed —
    # and anything it needs from here should have been handed to it, like every other input.
    io_deed:
      - io_question
      - shape
    io_question:
      - shape
    # A door mirrors the row of the kind it is a sister to, because it IS that kind — it
    # only happens to wrap something old. What it really talks to, the old world, is
    # unclassified, and an unclassified constant is skipped, so that needs no row here.
    legacy_deed:
      - question
      - legacy_question
      - shape
      - record
    legacy_question:
      - shape
      - record
    shape: []
    record: []

Shipshape/KindIsInheritedNotOnlyPlaced:
  Description: >-
    A kind is decided by inheritance, not by placement alone. A class filed on a governed
    path that names no declared base — or names one that resolves to nothing this canon
    installed — is that kind to every cop here and inherits none of what the kind means.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which kinds this covers is never declared here: it is exactly the kinds BaseClasses
  # names on Shipshape/CallGraph, so a kind added there without a base is skipped rather
  # than guessed at, and a kind given one is covered from the next run with nothing to edit.

Shipshape/OneOperationOneClass:
  Description: >-
    An operation is a class with one public method, taking keyword arguments. A second
    public method is a second operation, and it gets a second class.
  Enabled: true
  # Scaffolding `private` is not behaviour-preserving: a caller doing `operation.call`
  # breaks. It breaks under the rule anyway, so the fix arrives under `-A`, never `-a`.
  SafeAutoCorrect: false
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which kinds are operations. The layout itself — which paths hold which kind — is
  # declared once on Shipshape/CallGraph and read from there, so it is not repeated here.
  OperationKinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question
  PublicMethod: call
  # The permission model requires this second name: an operation that runs before anyone is
  # identified says so by implementing it instead of `call`. A class defining both is still
  # refused, as a second public method.
  AnonymousMethod: anonymous_call
  # **Tests are exempt.** A test legitimately builds an object directly, reaches a private
  # method, and stubs what it needs — that is what a test is for, and refusing it would make
  # this cop the first thing a team turns off. The rules here are about the code that ships.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/NoDecisionsInRequestHandling:
  Description: >-
    Request handling places what an operation answered. It does not decide anything on the
    payload's behalf — a rule asked in a controller has two owners and they will disagree.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # The layout is declared once on Shipshape/CallGraph and read from there.
  Kinds:
    - request_handling
    - entry_point

Shipshape/NoCallbacks:
  Description: >-
    A record holds no lifecycle callbacks. The caller reads one method and gets several, in
    an order nothing states, and a failure in any of them is attributed to the save.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - record

Shipshape/PresentationHoldsNoRecords:
  Description: >-
    A record is only allowed in a deed or a question. The matrix holds that where the record is
    named; a shape or a component is asked instead, because an argument names no constant.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - shape
    - view_component
  Sweep: HoldsNoRecords

Shipshape/CommentBudget:
  Description: >-
    A file carries at most a tenth of its own code in comment lines. A comment is a second
    copy of a rule, and the copy is the one that goes on being believed once the rule moves.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Max: 10

Shipshape/EnforcementMessagesAreDocumentation:
  Description: >-
    An offence message states what is wrong, why the rule exists, and a correct example.
    The failure is where a rule is delivered, and for an agent it is the whole context.
  Enabled: true
  VersionAdded: '0.0.1'
  # No path list: a file is a cop because it calls add_offense, which nothing else does.
  Include:
    - '**/*.rb'

# The three cops below share one default kind list: the operation and value trees. The
# layout itself is declared once on Shipshape/CallGraph and read from there.
  # **Tests are exempt.** A test legitimately builds an object directly, reaches a private
  # method, and stubs what it needs — that is what a test is for, and refusing it would make
  # this cop the first thing a team turns off. The rules here are about the code that ships.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/NoTypeInterrogation:
  Description: >-
    Nothing dispatches on what kind of thing it was handed. An assertion has one outcome,
    a dispatch has two, and only the assertion is allowed.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - shape
    - view_component
  # **The legacy doors are deliberately absent, and this is the exemption, not an oversight.**
  # Adapting a shape the old world returns is what a door is FOR — `result.is_a?(Hash)` over a
  # legacy return value is the crossing being made explicit, which is the opposite of the
  # defect this cop names. Every other rule still binds them.
    # **A view component is the other presentation kind**, and the matrix says so: its whole
    # row is `shape`. It renders what it was handed. `Current.user` in a component, a clock
    # read at render time, or a constant mutated mid-render are the same defects they are in
    # a shape, and this kind carried none of the rules until it was audited for it.
    - view_component

Shipshape/NoAmbientReads:
  Description: >-
    An operation reads what it was given. The clock, the zone, a global, a thread local,
    the environment, and a moment parsed or cast with no zone named, are dependencies that
    do not appear in the signature.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - shape
    # **A view component is the other presentation kind**, and the matrix says so: its whole
    # row is `shape`. It renders what it was handed. `Current.user` in a component, a clock
    # read at render time, or a constant mutated mid-render are the same defects they are in
    # a shape, and this kind carried none of the rules until it was audited for it.
    - view_component
    # **A legacy door is new code.** Only the world on the far side of it is old — the door
    # itself takes what it was given, like every other kind. Left out until the kinds were
    # audited, so a door could read the clock or mutate a constant with nothing objecting.
    - legacy_deed
    - legacy_question

Shipshape/NoDistantWrites:
  Description: >-
    Nothing is changed that the caller cannot see from the call. This is the
    action-at-a-distance guard, and nothing else in the canon catches it.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - shape
    # **A view component is the other presentation kind**, and the matrix says so: its whole
    # row is `shape`. It renders what it was handed. `Current.user` in a component, a clock
    # read at render time, or a constant mutated mid-render are the same defects they are in
    # a shape, and this kind carried none of the rules until it was audited for it.
    - view_component
    # **A legacy door is new code.** Only the world on the far side of it is old — the door
    # itself takes what it was given, like every other kind. Left out until the kinds were
    # audited, so a door could read the clock or mutate a constant with nothing objecting.
    - legacy_deed
    - legacy_question
    # **The seams too.** A controller or a job mutating a global or a constant is the same
    # action at a distance it is anywhere else, and there is no adapter's excuse for it — the
    # seam parses input and calls an operation. They stay out of `Shipshape/NoAmbientReads`
    # for the opposite reason: reading ambient state is exactly what a seam is for, and a cop
    # that fired on `params` would be refusing the job.
    - request_handling
    - entry_point

Shipshape/TypedArguments:
  Description: >-
    Every keyword an operation takes passes through a type guard, in a hand-written
    initializer. Anything that is not a named keyword is its own offence, and a keyword
    declared as a bare Time or DateTime names no zone.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question
    # **A shape holds a shape and validates that shape**, which is the whole of what it is
    # for — so its initializer is asserted exactly as a door's is. Left out until it was
    # audited for, and a shape could take a positional, a `**rest`, or an unguarded keyword
    # with nothing objecting.
    - shape
    # A component's initializer is the same case: it is handed what it renders, and what it
    # was handed is the only thing it knows.
    - view_component

# The two seam cops. Both are scoped to the doors, because the domain past them is handed
# real values and never parses anything.
Shipshape/NoInlineParamParse:
  Description: >-
    Request input is parsed by named parsers at the edge, not inline where a typo becomes
    a 500 the requester cannot act on.
  Enabled: true
  # The correction is deliberately NOT behaviour-preserving: a silent 0 becomes a bounce,
  # which is the rule. So it arrives under `-A`, never `-a` — applying it silently to a
  # running application would be the same sin the cop is named for.
  SafeAutoCorrect: false
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - request_handling
    - entry_point

Shipshape/NoUnparsedLookup:
  Description: >-
    A raw parameter never reaches a finder or a writer. The adapter coerces it, so the
    lookup succeeds against the wrong row and nothing fails.
  Enabled: true
  # The correction is deliberately NOT behaviour-preserving: a silent 0 becomes a bounce,
  # which is the rule. So it arrives under `-A`, never `-a` — applying it silently to a
  # running application would be the same sin the cop is named for.
  SafeAutoCorrect: false
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - request_handling
    - entry_point

# The two migration cops. Scoped by path, not by kind — a migration is not a class, so the
# kind registry has nothing to say about it.
Shipshape/AbsenceIsAbsenceNeverAValue:
  Description: >-
    A concern nobody modelled shows up as a nullable column. Fires only on a table some
    Record in this repository claims, so an adopter is not penalised for a table it has not
    reached yet.
  Enabled: true
  VersionAdded: '0.0.1'
  Kinds:
    - record
  Include:
    - 'db/migrate/**/*.rb'
    - 'db/*/migrate/**/*.rb'
  # An engine's migrations are someone else's file, and holding them to a house rule only
  # ever means a red build.
  Exclude:
    - 'db/migrate/**/*_from_*.rb'

Shipshape/NoColumnDefaults:
  Description: >-
    No column carries a database default. The column refuses the gap; the domain names the
    fallback. Creation and update timestamps excepted.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - 'db/migrate/**/*.rb'
    - 'db/*/migrate/**/*.rb'
  Exclude:
    - 'db/migrate/**/*_from_*.rb'

Shipshape/NoEmptyRescue:
  Description: >-
    A rescue that is empty, only logs, or only returns a literal stops a failure that was
    already signalled. The known error swallowed is the dangerous one.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # **Tests are exempt.** A test legitimately builds an object directly, reaches a private
  # method, and stubs what it needs — that is what a test is for, and refusing it would make
  # this cop the first thing a team turns off. The rules here are about the code that ships.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/NoSilentCoercion:
  Description: >-
    A cast that cannot fail turns rubbish into a plausible value. Flags the non-raising
    numeric casts on a value traceable to an untrusted source in the same expression.
  Enabled: true
  # The correction is deliberately NOT behaviour-preserving: a silent 0 becomes a bounce,
  # which is the rule. So it arrives under `-A`, never `-a` — applying it silently to a
  # running application would be the same sin the cop is named for.
  SafeAutoCorrect: false
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Only a request-handling file is corrected: the parsers live in TypedParams, which
  # the installer wires into ApplicationController and nowhere else.
  Kinds:
    - request_handling
    - entry_point
  # **Tests are exempt.** A test legitimately builds an object directly, reaches a private
  # method, and stubs what it needs — that is what a test is for, and refusing it would make
  # this cop the first thing a team turns off. The rules here are about the code that ships.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/PersistenceHoldsNoBehaviour:
  Description: >-
    A record maps rows and holds no rules. A method here is reachable from everywhere a
    record is, which is how one concern after another settles on the same class.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - record

Shipshape/PresenceIsNotRedefined:
  Description: >-
    A shape does not answer `present?`, `blank?` or `empty?` for itself. Request handling tests
    `present?` and `success?`, and nothing else, and `present?` means one thing: did the
    question find anything.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - shape

Shipshape/ShapeIsComposed:
  Description: >-
    A domain object holds another; it never copies its fields. A flattened field is the
    first column of the next god object.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - shape
  # How many keywords must share a prefix before it reads as flattening rather than as a
  # name. One prefixed keyword is just a name; firing on it would make the cop worthless.
  MinimumFields: 2

Shipshape/NoGeneratedInterfaces:
  Description: >-
    No private macro writes code a reader would otherwise grep for. The framework's public
    conventions are exempt; a convention invented here has a corpus of one repository.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question
    - shape
    - record
    # A component that invents a macro hides the same thing: a reader greps for the method
    # and finds the generator instead.
    - view_component

Shipshape/AggregationIsReadable:
  Description: >-
    An operation demands what it reaches, read out of its `call`. So what it reaches must be
    readable there: a receiver that is not a constant, or an operation called from another
    method, makes the aggregate short - and a short aggregate refuses at the work, not the door.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question
  # A deed naming no operation is an ordinary deed. A workflow naming none is not a
  # workflow, so only this kind is failed for sequencing nothing.
  SequencingKinds:
    - workflow

Shipshape/EveryDoorChecksPermission:
  Description: >-
    An installed base class that lost its permission check disables authorisation for every
    operation of that kind, and nothing else fails. This notices.
  Enabled: true
  VersionAdded: '0.0.1'
  # The generated base classes only. Scoped by path because these are not domain classes and
  # the kind registry has nothing to say about them.
  Include:
    - 'app/shipshape/*.rb'
    - '**/shipshape/*.rb'

Shipshape/OperationsAreLeaves:
  Description: >-
    A base class is inherited exactly once, and its door is not overridable. A second level
    inherits the door's answers — permission, transaction, return type — without asking.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question

Shipshape/NoEntryPointBypass:
  Description: >-
    An operation is built and run only through its class method. `send` steps around the
    private constructor, skipping the permission check, the transaction and the type
    assertion.
  Enabled: true
  VersionAdded: '0.0.1'
  Constructor:
    - new
    # Public on every Ruby class and it skips `initialize`, so `private_class_method :new`
    # alone left `SettleInvoice.allocate.__perform__(actor)` running unauthenticated.
    - allocate
  Forwarder: __perform__
  Include:
    - '**/*.rb'
  # The generated base classes are where the legitimate `send` lives. Excluded by path, not
  # by name: an application file called deed.rb is not one of these.
  # Tests are exempt: a test legitimately reaches a private method, and refusing that would
  # make this the first cop a team turns off.
  Exclude:
    - 'app/shipshape/*.rb'
    - '**/shipshape/*.rb'
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/OnlyTheDoorIsCalled:
  Description: >-
    An operation answers `call` and nothing else. Read at the call site, so it holds
    whatever the visibility says — `private` is a convention Ruby will step over.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # The door, plus the class-level API the base classes provide for asking about an
  # operation without running it.
  # **Neither `permits?` nor `permissions`.** The only reason a caller asks either is to
  # branch, and `permissions` is the same question in a longer spelling — one that disagrees
  # with the door for an anonymous operation. `permission` stays: it is the name, which a
  # label table and a seed are keyed by.
  AllowedMessages:
    - call
    - permission
    - anonymous?
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question
  # **Deferring is running, at a different time**, so it goes through the base class exactly
  # as `call` does — the permission check, the argument assertion and the audit entry all
  # happen. But only the writing doors have the method: a workflow spans several transactions
  # and a question answers nothing to nobody. Allowed for those kinds and refused for the rest,
  # rather than added to AllowedMessages, which is checked before the kind is known.
  DeferredMessages:
    - call_later
  DeferrableKinds:
    - deed
    - io_deed
    - legacy_deed
  # **And the kinds that may not send it.** A workflow states an order; a deferred step leaves
  # that order, so the sequence answers success for work that has not happened.
  SequencingKinds:
    - workflow
  # The test trees are excluded here and read by `Shipshape/NoTestFactories` instead, which
  # holds `no-test-factories`: a test builds state by calling operations, and `test_call` is
  # the declared way to skip only the permission check. A bare `Operation.new(...)` in a test
  # is caught by neither, and that residue is stated in `an-operation-is-a-leaf`.
  # The generated base classes are where the legitimate construction lives.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'
    - 'app/shipshape/*.rb'
    - '**/shipshape/*.rb'

Shipshape/MixinsAddNothingPublic:
  Description: >-
    A module mixed into an operation declares no public instance methods. An operation has
    one public method, and a concern can put back everything that closed — in a file none of
    the operations including it mention.
  Enabled: true
  # Scaffolding `private` changes what callers can reach, which is the point of it. The fix
  # arrives under `-A`, never `-a`.
  SafeAutoCorrect: false
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which kinds count as operations, so a module included by one is held to their rules. The
  # layout itself is declared once on Shipshape/CallGraph and read from there.
  OperationKinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question
  # Excluded because `OperationKinds` names workflows, deeds, questions and IO doors, and no
  # test file is any of those - not because a test module may hand out public helpers through a
  # mixin. It may not: `Shipshape/NoTestMixins` forbids exactly that, everything this cop
  # exempts included.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/QuestionsNeverWrite:
  Description: >-
    A question never writes. It may reach a record, so the call graph allows the call and cannot
    see that the message sent is a write - and a question opens no transaction, so the write
    runs outside one.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # The read-only doors. A deed may write; that is what it is for.
  Kinds:
    - question
    - io_question
    - legacy_question
  RecordKinds:
    - record
  # **Tests are exempt.** A test sets up rows directly, which is what a test is for.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/OperationsOpenNoTransaction:
  Description: >-
    An operation never opens a database transaction. The generated base class already opens
    exactly one; a subclass calling `transaction` has nested it or silently widened it, with
    nobody deciding which.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question

Shipshape/IoIsItsOwnKind:
  Description: >-
    A call to the outside is an operation of its own. The call matrix cannot refuse one
    written inline, because a gem's constant resolves to no file under any declared glob and
    is skipped.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Everything except the kinds whose job is the outside, and the legacy doors, which wrap an
  # old world this canon has not classified.
  Kinds:
    - workflow
    - deed
    - question
    - shape
    - view_component
    - record
    - request_handling
    - entry_point
  # **This list IS the fact.** Being named here is what makes a constant IO; nothing infers
  # it. Add your own vendors - a client that is not here is invisible, not permitted.
  #
  # `File` and `Dir` are deliberately absent: `File.join` is a string operation and
  # `File.read` is not, and separating them needs a per-constant method list that would drift.
  Constants:
    - 'Net::HTTP'
    - 'Net::HTTPS'
    - 'Net::FTP'
    - 'Net::SMTP'
    - 'Net::IMAP'
    - 'Net::POP3'
    - 'Net::Telnet'
    - 'Socket'
    - 'TCPSocket'
    - 'UDPSocket'
    - 'UNIXSocket'
    - 'BasicSocket'
    - 'OpenURI'
    - 'Faraday'
    - 'RestClient'
    - 'HTTParty'
    - 'Excon'
    - 'Typhoeus'
    - 'Curl'
    - 'Curl::Easy'
    - 'HTTPX'
    - 'HTTPClient'
  # **Tests are exempt.** A test stubs the outside, and naming the client is how it does that.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/PersonalDataIsDeclared:
  Description: >-
    Every column whose name suggests a person is classified in app/shipshape/personal_data.rb
    with what happens to it on erasure. NOT a compliance check - it makes the inventory exist
    and keeps it from going stale, and says nothing about lawfulness.
  Enabled: true
  VersionAdded: '0.0.1'
  # The schema is the one place every column appears exactly once.
  Include:
    - 'db/schema.rb'
  Registry: 'app/shipshape/personal_data.rb'
  # **This list IS the fact.** A name not here is unexamined, not cleared - a field named for
  # the business rather than for the person is invisible until somebody adds it.
  Names:
    - email
    - phone
    - mobile
    - telephone
    - address
    - postcode
    - zipcode
    - ip_address
    - first_name
    - last_name
    - full_name
    - surname
    - forename
    - maiden_name
    - date_of_birth
    - dob
    - birth_date
    - passport
    - national_id
    - ssn
    - nino
    - tax_id
    - latitude
    - longitude
    - gender
    - nationality
    - signature
    - avatar
    - photo

Shipshape/AssociationsSurviveErasure:
  Description: >-
    An association with no `dependent:` leaves its children behind when the parent is deleted,
    and nobody chose that. The option is where the choice is written down.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - record
  Associations:
    - has_many
    - has_one
    - has_and_belongs_to_many
  # **Tests are exempt.** A fixture declares associations to build data, not to model a domain.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/DeedsProveIdempotence:
  Description: >-
    Every deed's test says what happens when it runs twice. `tell-dont-ask` already obliges
    it - a caller may not ask whether the work has happened, so the deed owns repetition -
    and a queue retry is what makes it load-bearing.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - deed
    - io_deed
    - legacy_deed
  # The phrase IS the act being required, the same way `Watched to fail` is. The check is that
  # somebody wrote it; no check makes the judgement behind it.
  Claim: 'Idempotent:'
  TestRoots:
    - test
    - spec
  # A test declares idempotence; it is not itself held to it.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/AnonymityIsClosedDownward:
  Description: >-
    An anonymous operation runs before anyone is identified, so a guarded operation it calls
    runs for nobody. Anonymity is a claim about a subtree, not about one method.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
    - deed
    - question
    - io_deed
    - io_question
    - legacy_deed
    - legacy_question

Shipshape/NoTestFactories:
  Description: >-
    A test builds state by calling operations. A factory is a second way to construct domain
    state, obeying none of the rules - so it can build a row the application cannot.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'
    # `*` does not cross a `/` under `File::FNM_PATHNAME`, so a single level reached
    # `engines/test/` — a layout nobody uses — and left `engines/billing/test/` uninspected.
    - '**/test/**/*.rb'
    - '**/spec/**/*.rb'

Shipshape/NothingSchedulesWork:
  Description: >-
    A schedule is a row - which deed, what arguments, how often, and as whom - not a
    cadence declared in code. Work that starts on a clock runs under somebody's name.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'

Shipshape/WorkflowsBranchOnOutcome:
  Description: >-
    A workflow sequences; it does not work. It branches on whether a step succeeded, never on
    what the step answered with - a rule read out of the answer applies to that one sequence
    instead of to every caller of the operation that owns it.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  Kinds:
    - workflow
  # What a step's answer is called. Everything else a `Result` offers - `success?`,
  # `failure?`, `error` - is the outcome, and the outcome is what a workflow may ask.
  ValueMessage: value
  # **Tests are exempt.** A test asserts on what an operation answered; that is its job.
  Exclude:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'

Shipshape/OperationsReportWhatTheyDid:
  Description: >-
    An installed base class that lost its audit call leaves no trace of anything its kind
    attempted, including the refusals, and nothing else fails. The sibling of
    Shipshape/EveryDoorChecksPermission, for the audit log.
  Enabled: true
  VersionAdded: '0.0.1'
  # The generated base classes only. An application class that happens to share a name is not
  # one of them.
  Include:
    - '**/shipshape/*.rb'
  # The operations that perform an act. A question answers a caller and changes nothing, and a
  # workflow only sequences — its steps each record what they did, so an entry from the
  # workflow would be a second row saying that the rows below it happened.
  Operations:
    - deed
    - io_deed
    - legacy_deed
  Recorder: AuditLog

Shipshape/NoTestMixins:
  Description: >-
    A test shares behaviour by inheriting the one base test class, never by mixing a module
    into itself - the same argument Shipshape/MixinsAddNothingPublic makes for operations.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'
    # `*` does not cross a `/` under `File::FNM_PATHNAME`, matching NoTestFactories's own fix.
    - '**/test/**/*.rb'
    - '**/spec/**/*.rb'

Shipshape/BaseTestClassGrowth:
  Description: >-
    A base test class every other test inherits from is identified by where it lives, not by
    what it is named - every file under a test tree that is not itself a leaf test. Growth on
    it is a ratchet: the count of definitions it holds, and its size in lines, only fall.
  Enabled: true
  VersionAdded: '0.0.1'
  # A leaf test - one whose name says a suite runs it directly - is excluded; everything else
  # under a test tree is presumed a base or support class and held to the ratchet.
  Include:
    - 'test/**/*.rb'
    - 'spec/**/*.rb'
    - '**/test/**/*.rb'
    - '**/spec/**/*.rb'
  # A `module` has no superclass to read, which is why `on_module` cannot tell a shared test
  # module from an engine's dummy Rails app reusing the same tree - `test/dummy` and
  # `spec/dummy` are that app's own root, generated by `rails plugin new` and never edited
  # by hand, so a concern under its `app/models/concerns` or the `module` a generated
  # `config/application.rb` wraps itself in is not this law's business either. A dummy app at
  # a nonstandard path (`--dummy-path`) is still invisible to this rule.
  Exclude:
    - '**/*_test.rb'
    - '**/*_spec.rb'
    - 'test/dummy/**/*'
    - 'spec/dummy/**/*'
    - '**/test/dummy/**/*'
    - '**/spec/dummy/**/*'
