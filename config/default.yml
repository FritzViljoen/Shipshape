Shipshape/CallGraph:
  Description: >-
    Every class has a kind, and which kinds may call which is declared once, as a matrix.
    A rule cannot escape its home if there is nowhere reachable to escape to.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which paths hold which kind. Order matters: the first match wins, so put the
  # narrower tree above the wider one.
  Kinds:
    request_handling:
      - 'app/controllers/**/*.rb'
      - 'packs/*/app/controllers/**/*.rb'
    workflow:
      - 'app/workflows/**/*.rb'
      - 'packs/*/app/workflows/**/*.rb'
    # An integration's classes are commands and queries like any others. A remote read is
    # a query and a remote write is a command, so they are filed in these trees —
    # app/queries/stripe/fetch_rates.rb, app/commands/stripe/send_invoice.rb.
    #
    # A glob's trailing wildcards are dropped and what remains is expanded on disk to get
    # the autoload roots a constant name is resolved against — so a Packwerk layout works
    # without a second mechanism.
    command:
      - 'app/commands/**/*.rb'
      - 'packs/*/app/commands/**/*.rb'
    query:
      - 'app/queries/**/*.rb'
      - 'packs/*/app/queries/**/*.rb'
    entity:
      - 'app/entities/**/*.rb'
      - 'app/values/**/*.rb'
      - 'packs/*/app/entities/**/*.rb'
    record:
      - 'app/records/**/*.rb'
      - 'app/models/**/*.rb'
      - 'packs/*/app/records/**/*.rb'
      - 'packs/*/app/models/**/*.rb'
  # Who may call whom. A pair absent from this matrix is an offence.
  #
  # NO KIND CALLS ITS OWN KIND. That rule lives in the cop, not here: a row that names
  # itself is refused as a contradiction rather than honoured as a permission. This matrix
  # says which OTHER kinds are reachable.
  #
  # A sister call is how a class quietly becomes the kind above it — a command sequencing
  # commands is a workflow that never said so, and a query composing queries is the read
  # that turns into an N+1. Sequence them from the kind above instead.
  #
  # There is no separate kind for talking to the outside. A read is a read and a write is
  # a write; REST drew that line already, and a kind whose only claim is that the store
  # belongs to somebody else forbids nothing the existing pair does not.
  Matrix:
    request_handling:
      - workflow
      - command
      - query
    workflow:
      - command
      - query
    command:
      - query
      - entity
      - record
    query:
      - entity
      - record
    entity: []
    record: []
