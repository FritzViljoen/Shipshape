Shipshape/CallGraph:
  Description: >-
    Every class has a kind, and which kinds may call which is declared once, as a matrix.
    A rule cannot escape its home if there is nowhere reachable to escape to.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which paths hold which kind. Order matters: the first match wins, so put the
  # narrower tree above the wider one.
  #
  # A glob's trailing wildcards are dropped and what remains is expanded on disk to get
  # the autoload roots a constant name is resolved against — so a Packwerk layout needs no
  # second mechanism, and each pack becomes its own root.
  #
  # Two kinds carry a filename suffix, and for one reason: they are the two that are
  # infrastructure rather than domain. Everything the MVC model used to hold has been split
  # into workflows, commands, queries and entities, so what is still called a record is
  # only the table — and it is named to say so.
  #
  # An integration's classes are commands and queries like any others. A remote read is a
  # query and a remote write is a command; whose store it is changes nothing about what the
  # operation is.
  Kinds:
    request_handling:
      - 'app/controllers/**/*_controller.rb'
      - 'packs/*/controllers/**/*_controller.rb'
    workflow:
      - 'app/workflows/**/*.rb'
      - 'packs/*/workflows/**/*.rb'
    command:
      - 'app/commands/**/*.rb'
      - 'packs/*/commands/**/*.rb'
    query:
      - 'app/queries/**/*.rb'
      - 'packs/*/queries/**/*.rb'
    entity:
      - 'app/entities/**/*.rb'
      - 'packs/*/entities/**/*.rb'
    record:
      - 'app/records/**/*_record.rb'
      - 'app/models/**/*.rb'
      - 'packs/*/records/**/*_record.rb'
      - 'packs/*/models/**/*.rb'
  # Who may call whom. A pair absent from this matrix is an offence.
  #
  # NO KIND CALLS ITS OWN KIND. That rule lives in the cop, not here: a row that names
  # itself is refused as a contradiction rather than honoured as a permission. This matrix
  # says which OTHER kinds are reachable.
  #
  # A sister call is how a class quietly becomes the kind above it — a command sequencing
  # commands is a workflow that never said so, and a query composing queries is the read
  # that turns into an N+1. Sequence them from the kind above instead.
  Matrix:
    request_handling:
      - workflow
      - command
      - query
    workflow:
      - command
      - query
    command:
      - query
      - entity
      - record
    query:
      - entity
      - record
    entity: []
    record: []

Shipshape/OneOperationOneClass:
  Description: >-
    An operation is a class with one public method, taking keyword arguments. A second
    public method is a second operation, and it gets a second class.
  Enabled: true
  VersionAdded: '0.0.1'
  Include:
    - '**/*.rb'
  # Which kinds are operations. The layout itself — which paths hold which kind — is
  # declared once on Shipshape/CallGraph and read from there, so it is not repeated here.
  OperationKinds:
    - workflow
    - command
    - query
  PublicMethod: call
