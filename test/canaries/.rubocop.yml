# Generated by `shipshape canaries --plant`. Each file here is a deliberate
# violation, planted so a cop that stops running is noticed — a guard that does not
# run reports the same thing as a guard that finds nothing.
#
# Exclude this directory from your ordinary lint run, or it fails for ever.
inherit_from:
  - ../../config/default.yml

# Every file here is a deliberate violation, so the correcting cops must not correct
# them: `rubocop -A` over this tree rewrites the canaries, and the next run blames
# the kind globs for a hole the correction made.
Shipshape/NoSilentCoercion:
  AutoCorrect: false
Shipshape/NoUnparsedLookup:
  AutoCorrect: false
Shipshape/NoInlineParamParse:
  AutoCorrect: false
Shipshape/MixinsAddNothingPublic:
  AutoCorrect: false
Shipshape/OneOperationOneClass:
  AutoCorrect: false

# **Every cop is on for this run, whatever it ships as.** A cop that is off by
# default is still one the canon claims, so it still has to be shown firing — and a
# canary that is never inspected reports the same thing as a cop that is broken.
Shipshape/CallGraph:
  Enabled: true
Shipshape/EnforcementMessagesAreDocumentation:
  Enabled: true
Shipshape/EveryDoorChecksPermission:
  Enabled: true
Shipshape/MixinsAddNothingPublic:
  Enabled: true
Shipshape/NoAmbientReads:
  Enabled: true
Shipshape/NoCallbacks:
  Enabled: true
Shipshape/NoColumnDefaults:
  Enabled: true
Shipshape/NoDecisionsInRequestHandling:
  Enabled: true
Shipshape/NoDistantWrites:
  Enabled: true
Shipshape/NoEmptyRescue:
  Enabled: true
Shipshape/NoEntryPointBypass:
  Enabled: true
Shipshape/NoGeneratedInterfaces:
  Enabled: true
Shipshape/NoInlineParamParse:
  Enabled: true
Shipshape/NoNullableColumns:
  Enabled: true
Shipshape/NoSilentCoercion:
  Enabled: true
Shipshape/NoTypeInterrogation:
  Enabled: true
Shipshape/NoUnparsedLookup:
  Enabled: true
Shipshape/OneOperationOneClass:
  Enabled: true
Shipshape/OnlyTheDoorIsCalled:
  Enabled: true
Shipshape/OperationsAreLeaves:
  Enabled: true
Shipshape/PersistenceHoldsNoBehaviour:
  Enabled: true
Shipshape/ShapeIsComposed:
  Enabled: true
Shipshape/TypedArguments:
  Enabled: true
Shipshape/WorkflowAggregatesPermissions:
  Enabled: true

AllCops:
  NewCops: disable
  SuggestExtensions: false
