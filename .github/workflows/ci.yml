name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: tests, lint, canaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The suite, and the comment budget over this gem's own files.
      - run: bundle exec rake

      # A guard that does not run reports the same thing as a guard that finds nothing. This
      # runs the real binary over one planted violation per cop, under real globs.
      - run: bundle exec exe/shipshape canaries

  removal:
    name: every guard watched to fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Neuters each cop in turn and confirms its own test goes red. Minutes, and a separate
      # job because it spawns a Ruby process per cop.
      - run: bundle exec rake test:removal

  ratchet:
    name: nothing rose against the base
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The ratchet derives its baseline from the merge base, so it needs the history to find
      # one. A shallow clone makes it fail rather than lie, which is the right way round.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: bundle exec exe/shipshape check --trunk origin/${{ github.base_ref }}
